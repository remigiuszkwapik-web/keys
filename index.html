<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Key-Momente">
<title>Remis Key-Momente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: Messgerät-Logbuch. Senkrechte Zeitskala (1 Tag = 1 Teilstrich, KW als Hauptstrich),
   feste Lesekante quer über dem Bildschirm; der Moment an der Lesekante fährt seitlich aus.
   Stil: Design-System „Instrument“ (Aluminium / Graphit, eine Signalfarbe). */
:root {
  --alu-ground: #E2E0DB; --alu-well: #EAE8E3; --alu-face: #F5F4F0;
  --alu-track: #CDCAC4; --alu-edge: #C3C0BA; --steel: #9C9993;
  --ink: #1E1E1C; --ink-muted: #5C5A56;
  --signal: #F05A22; --signal-text: #A5380D; --on-signal: #1E1E1C;
  --led-ok: #2F8F55;
  --shade: rgba(0,0,0,0.13); --glint: rgba(255,255,255,0.8);
  --font-sans: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --px-day: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --alu-ground: #1B1C1C; --alu-well: #141515; --alu-face: #262727;
    --alu-track: #333432; --alu-edge: #42433F; --steel: #6B6A65;
    --ink: #ECEAE5; --ink-muted: #A3A09A;
    --signal: #F26A36; --signal-text: #FF8A5C; --on-signal: #1B1C1C;
    --led-ok: #4FB37A;
    --shade: rgba(0,0,0,0.55); --glint: rgba(255,255,255,0.06);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --alu-ground: #1B1C1C; --alu-well: #141515; --alu-face: #262727;
  --alu-track: #333432; --alu-edge: #42433F; --steel: #6B6A65;
  --ink: #ECEAE5; --ink-muted: #A3A09A;
  --signal: #F26A36; --signal-text: #FF8A5C; --on-signal: #1B1C1C;
  --led-ok: #4FB37A;
  --shade: rgba(0,0,0,0.55); --glint: rgba(255,255,255,0.06);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--alu-ground); color: var(--ink);
  font-family: var(--font-sans); font-size: 15px; line-height: 22px;
  padding: 0 16px; padding-block: 28px 45vh;
}
.wrap { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

.label { font-size: 10px; line-height: 14px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-muted); }
.mono { font-family: var(--font-mono); font-size: 12px; line-height: 16px; letter-spacing: .02em; color: var(--ink-muted); font-variant-numeric: tabular-nums; }

/* Kopf: Frontplatte */
header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.titleblock { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
h1 { margin: 0; font-size: clamp(30px, 8vw, 40px); line-height: 1; font-weight: 600; letter-spacing: -.02em; }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; }
.led { width: 10px; height: 10px; border-radius: 50%; background: var(--led-ok); box-shadow: 0 0 0 2px var(--alu-track), 0 0 8px var(--led-ok); }
.controls { display: flex; align-items: flex-end; gap: 20px; }
.cap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.key {
  width: 52px; height: 52px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--alu-face); color: var(--ink); font: 600 20px/1 var(--font-sans);
  box-shadow: inset 0 0 0 1px var(--alu-edge), inset 0 2px 3px var(--shade), 0 1px 2px var(--shade);
  transition: transform .08s;
}
.key:active { transform: translateY(1px); }
.key[aria-expanded="true"] { background: var(--signal); color: var(--on-signal); box-shadow: inset 0 2px 3px var(--shade), 0 0 0 4px var(--alu-ground), 0 0 0 5px var(--alu-edge); }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; }

/* Readouts */
.readouts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.well { background: var(--alu-well); border-radius: 18px; box-shadow: inset 0 2px 4px var(--shade), inset 0 -1px 0 var(--glint); }
.readout { padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.readout b { font-size: 26px; line-height: 30px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.readout b small { font-size: 13px; font-weight: 500; color: var(--ink-muted); }

/* Eingabe */
#add { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
#add textarea, #add input {
  width: 100%; font: 15px/22px var(--font-sans); color: var(--ink); background: var(--alu-face);
  border: 0; border-radius: 6px; padding: 10px 12px; box-shadow: inset 0 0 0 1px var(--alu-edge);
}
#add textarea { min-height: 88px; resize: vertical; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 180px; }
.formrow { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.go {
  height: 44px; padding: 0 22px; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--signal); color: var(--on-signal); font: 600 15px/1 var(--font-sans);
  box-shadow: inset 0 2px 3px var(--shade), 0 0 0 4px var(--alu-well), 0 0 0 5px var(--alu-edge);
}
.go:disabled { opacity: .5; cursor: default; }
#formstatus { min-height: 16px; }

/* Zeitstrahl */
.trackwell { border-radius: 32px; padding: 20px 0 28px; position: relative; overflow: hidden; }
#track { position: relative; margin: 0 16px; }
#scale { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
#scale .minor { stroke: var(--steel); stroke-width: 1; }
#scale .major { stroke: var(--ink); stroke-width: 2; }
#scale .rail { stroke: var(--alu-edge); stroke-width: 1; }
#scale text { font-family: var(--font-mono); font-size: 11px; fill: var(--ink-muted); }
#scale text.now { fill: var(--signal-text); font-weight: 500; }
#scale .nowtick { stroke: var(--signal); stroke-width: 3; stroke-linecap: round; }
#scale .link { fill: none; stroke: var(--alu-edge); stroke-width: 1; transition: stroke .25s; }
#scale .link.on { stroke: var(--signal); stroke-width: 1.5; }
#scale .pin { fill: var(--alu-face); stroke: var(--ink); stroke-width: 1.5; transition: fill .25s; }
#scale .pin.on { fill: var(--signal); stroke: var(--signal); }

.moment {
  position: absolute; border-radius: 18px; padding: 14px 16px 16px;
  background: var(--alu-well); box-shadow: inset 0 2px 4px var(--shade), inset 0 -1px 0 var(--glint);
  display: flex; flex-direction: column; gap: 6px;
  transform: translateX(var(--rest-x, -10px)); opacity: .82;
  transition: transform .45s cubic-bezier(.2,.8,.2,1), background .25s, box-shadow .25s, opacity .25s;
}
.moment.right { --rest-x: -10px; }
.moment.left { --rest-x: 10px; }
.moment.on {
  transform: none; opacity: 1; background: var(--alu-face);
  box-shadow: inset 0 0 0 1px var(--alu-edge), 0 1px 2px var(--shade), 0 6px 14px -6px var(--shade);
}
.moment .stamp { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.moment .area { color: var(--signal-text); }
.moment h2 { margin: 0; font-size: 20px; line-height: 25px; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
.moment p { margin: 0; max-width: 60ch; }
.moment .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.mini {
  height: 32px; padding: 0 14px; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--alu-face); color: var(--ink); font: 500 13px/1 var(--font-sans);
  box-shadow: inset 0 0 0 1px var(--alu-edge), 0 1px 2px var(--shade);
}
.mini:active { transform: translateY(1px); }
.mini.sig { background: var(--signal); color: var(--on-signal); box-shadow: inset 0 2px 3px var(--shade); }
.mini.warn { color: var(--signal-text); }
.moment .acts .mini { opacity: 0; transition: opacity .2s; }
.moment.on .acts .mini, .moment.editing .acts .mini, .moment .acts .mini:focus-visible { opacity: 1; }
@media (hover: none) { .moment .acts .mini { opacity: 1; } }
.moment .confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.moment.editing { opacity: 1; transform: none; background: var(--alu-face); box-shadow: inset 0 0 0 1px var(--signal), 0 6px 14px -6px var(--shade); }
.moment .ed { display: flex; flex-direction: column; gap: 10px; }
.moment .ed input, .moment .ed textarea {
  width: 100%; font: 15px/22px var(--font-sans); color: var(--ink); background: var(--alu-well);
  border: 0; border-radius: 6px; padding: 8px 10px; box-shadow: inset 0 1px 3px var(--shade);
}
.moment .ed textarea { min-height: 110px; resize: vertical; }
.hint { display: flex; align-items: center; gap: 8px; }
.hint svg { flex: none; }
.hint svg path, .hint svg rect { fill: none; stroke: var(--ink-muted); stroke-width: 1.5; stroke-linecap: round; }

#needle { position: fixed; left: 0; right: 0; top: 42vh; pointer-events: none; z-index: 2; }
#needle .in { max-width: 880px; margin: 0 auto; padding: 0 16px; position: relative; height: 0; }
#needle .bar { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dashed var(--signal); opacity: .55; }
#needle .tip { position: absolute; left: 0; top: -6px; width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 9px solid var(--signal); }
#needle .txt { position: absolute; right: 0; top: -18px; font-family: var(--font-mono); font-size: 11px; color: var(--signal-text); background: var(--alu-ground); padding: 0 6px; }

.empty { position: absolute; left: 80px; right: 0; top: 0; padding: 16px; border-radius: 18px; border: 1px dashed var(--alu-edge); color: var(--ink-muted); }

@media (max-width: 520px) {
  .readouts { gap: 8px; }
  .readout { padding: 10px 12px; }
  .readout b { font-size: 22px; line-height: 26px; }
}
@media (prefers-reduced-motion: reduce) {
  .moment, #scale .link, #scale .pin { transition: none; }
}
.remember { display: inline-flex; align-items: center; gap: 8px; flex: 1 1 180px; }
.remember input { width: 18px; height: 18px; accent-color: var(--signal); }
#unlock input[type=password] {
  width: 100%; font: 15px/22px var(--font-sans); color: var(--ink); background: var(--alu-face);
  border: 0; border-radius: 6px; padding: 10px 12px; box-shadow: inset 0 0 0 1px var(--alu-edge);
}
#unlock { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
#unlock[hidden] { display: none; }
[hidden] { display: none !important; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="titleblock">
      <span class="label">Logbuch · Erkenntnisse 01</span>
      <h1>Key-Momente</h1>
    </div>
    <div class="controls">
      <span class="status"><span class="led" aria-hidden="true"></span><span id="statusword">Lädt</span></span>
      <div class="cap" id="lockcap" hidden>
        <button class="key" id="lockbtn" aria-label="Logbuch sperren">
          <svg width="18" height="20" viewBox="0 0 18 20" aria-hidden="true"><rect x="2" y="9" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"></rect><path d="M5 9V6a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.8"></path></svg>
        </button>
        <span class="label">Sperren</span>
      </div>
    </div>
  </header>

  <div class="readouts">
    <div class="well readout"><span class="label">Momente</span><b id="r-count">–</b></div>
    <div class="well readout"><span class="label">Seit</span><b id="r-since">–</b></div>
    <div class="well readout"><span class="label">Zuletzt</span><b id="r-last">–</b></div>
  </div>

  <form id="unlock" class="well" hidden>
    <div class="field">
      <label class="label" for="pass">Passphrase</label>
      <input type="password" id="pass" autocomplete="current-password" required>
    </div>
    <div class="formrow">
      <label class="mono remember"><input type="checkbox" id="remember" checked> Auf diesem Gerät merken</label>
      <button type="submit" class="go" id="unlockbtn">Entsperren</button>
    </div>
    <span class="mono" id="formstatus" role="status">Die Momente liegen verschlüsselt im Repo. Erst mit der Passphrase werden sie lesbar.</span>
  </form>

  <section class="well trackwell" aria-label="Zeitstrahl">
    <div id="track">
      <svg id="scale" aria-hidden="true"></svg>
    </div>
  </section>
</div>
<div id="needle" aria-hidden="true"><div class="in"><span class="bar"></span><span class="tip"></span><span class="txt">Lesekante</span></div></div>

<script>
(function () {
  var DAY = 86400000, NS = "http://www.w3.org/2000/svg";
  var WD = ["So","Mo","Di","Mi","Do","Fr","Sa"];
  var MON = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
  var track = document.getElementById("track"), svg = document.getElementById("scale");
  var moments = [], cards = [], loaded = false;
  var colRef = null, writable = false, editing = null, pendingDocs = null;

  function p2(n) { return String(n).padStart(2, "0"); }
  function kw(d) {
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
    var y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil(((t - y0) / DAY + 1) / 7);
  }
  function stamp(d) { return WD[d.getDay()] + " " + p2(d.getDate()) + "." + p2(d.getMonth() + 1) + "." + d.getFullYear(); }
  function pxDay() { return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--px-day")) || 18; }
  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }

  function readouts() {
    var n = moments.length;
    document.getElementById("statusword").textContent = n ? "Aufzeichnung läuft" : "Bereit";
    document.getElementById("r-count").textContent = n;
    if (!n) { document.getElementById("r-since").textContent = "–"; document.getElementById("r-last").textContent = "–"; return; }
    var first = moments[moments.length - 1].d, last = moments[0].d;
    document.getElementById("r-since").innerHTML = "";
    var s = document.getElementById("r-since"); s.textContent = MON[first.getMonth()] + " ";
    var sm = document.createElement("small"); sm.textContent = String(first.getFullYear()).slice(2); s.appendChild(sm);
    var days = Math.round((startOf(new Date()) - startOf(last)) / DAY);
    var l = document.getElementById("r-last");
    l.textContent = days === 0 ? "heute" : days;
    if (days > 0) { var u = document.createElement("small"); u.textContent = days === 1 ? " Tag" : " Tage"; l.appendChild(u); }
  }
  function startOf(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }

  function layout() {
    var W = track.clientWidth, wide = W >= 680, PX = pxDay();
    var top = 40, end = startOf(new Date()) + DAY;
    var oldest = moments.length ? startOf(moments[moments.length - 1].d) : end - DAY;
    var span = Math.max(42, Math.ceil((end - oldest) / DAY) + 10);
    var railX = wide ? Math.round(W / 2) : 52;
    function yOf(t) { return top + (end - t) / DAY * PX; }

    // Karten platzieren
    var lastBottom = { left: -1e9, right: -1e9 };
    cards.forEach(function (c, i) {
      var side = wide ? (i % 2 ? "left" : "right") : "right";
      c.side = side;
      c.el.classList.toggle("left", side === "left");
      c.el.classList.toggle("right", side === "right");
      var w = wide ? Math.min(380, railX - 64) : W - railX - 28;
      c.el.style.width = w + "px";
      c.el.style.left = (side === "right" ? railX + 28 : railX - 28 - w) + "px";
      c.tickY = yOf(c.m.d.getTime());
      var h = c.el.offsetHeight;
      var y = Math.max(c.tickY - 22, lastBottom[side] + 16);
      c.el.style.top = y + "px";
      c.top = y; c.h = h; c.w = w;
      lastBottom[side] = y + h;
    });
    var H = Math.max(top + span * PX, lastBottom.left + 24, lastBottom.right + 24);
    track.style.height = H + "px";

    // Skala zeichnen
    svg.textContent = "";
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    el("line", { class: "rail", x1: railX, y1: 0, x2: railX, y2: H }, svg);
    el("line", { class: "nowtick", x1: railX - 14, y1: top, x2: railX + 14, y2: top }, svg);
    var nowT = el("text", { class: "now", x: wide ? railX - 20 : 0, y: top + 4 }, svg);
    if (wide) nowT.setAttribute("text-anchor", "end");
    nowT.textContent = wide ? "HEUTE · KW " + kw(new Date()) : "HEUTE";
    var days = Math.ceil((H - top) / PX);
    for (var k = 1; k <= days; k++) {
      var t = end - k * DAY, d = new Date(t), y = top + k * PX;
      var monday = d.getDay() === 1, first = d.getDate() === 1;
      var len = monday || first ? 12 : 5;
      el("line", { class: monday || first ? "major" : "minor", x1: railX - len, y1: y, x2: wide ? railX + len : railX, y2: y }, svg);
      if (monday) {
        el("text", { x: wide ? railX - 60 : 0, y: y - 4 }, svg).textContent = "KW " + kw(d);
      } else if (first) {
        el("text", { x: wide ? railX - 60 : 0, y: y - 4 }, svg).textContent = MON[d.getMonth()].toUpperCase();
      }
    }
    // Verbindungen
    cards.forEach(function (c) {
      var x2 = c.side === "right" ? railX + 28 : railX - 28, yc = c.top + 22;
      var mid = c.side === "right" ? railX + 14 : railX - 14;
      c.link = el("path", { class: "link", d: "M" + railX + " " + c.tickY + " L" + mid + " " + c.tickY + " L" + mid + " " + yc + " L" + x2 + " " + yc }, svg);
      c.pin = el("circle", { class: "pin", cx: railX, cy: c.tickY, r: 5 }, svg);
    });
    if (!moments.length && loaded) {
      var e = document.createElement("div");
      e.className = "empty"; e.style.left = (railX + 28) + "px"; e.style.top = "60px";
      e.textContent = "Noch keine Momente. Sprich im Chat „Key-Moment: …“ ein oder tippe auf +.";
      track.appendChild(e);
    }
    scan();
  }

  function scan() {
    if (!cards.length) return;
    var needle = window.innerHeight * 0.42, rect = track.getBoundingClientRect(), best = null, bd = 1e9;
    cards.forEach(function (c) {
      var mid = rect.top + Math.min(c.tickY, c.top + 22);
      var midCard = rect.top + c.top + Math.min(c.h, 120) / 2;
      var dist = Math.min(Math.abs(mid - needle), Math.abs(midCard - needle));
      if (dist < bd) { bd = dist; best = c; }
    });
    cards.forEach(function (c) {
      var on = c === best;
      c.el.classList.toggle("on", on);
      if (c.link) c.link.classList.toggle("on", on);
      if (c.pin) c.pin.classList.toggle("on", on);
    });
  }

  function btn(label, cls, fn) {
    var b = document.createElement("button"); b.type = "button"; b.className = "mini" + (cls ? " " + cls : "");
    b.textContent = label; b.addEventListener("click", fn); return b;
  }
  function finishEdit() {
    editing = null;
    if (pendingDocs) { var d = pendingDocs; pendingDocs = null; build(d); } else { build(lastDocs); }
  }
  function openEditor(c) {
    editing = c.m.id;
    var a = c.el, m = c.m;
    a.classList.add("editing");
    a.textContent = "";
    var s = document.createElement("div"); s.className = "stamp";
    var t = document.createElement("span"); t.className = "mono"; t.textContent = stamp(m.d) + " · bearbeiten"; s.appendChild(t);
    a.appendChild(s);
    var ed = document.createElement("div"); ed.className = "ed";
    function field(lbl, node) {
      var w = document.createElement("label"); w.className = "label"; w.style.display = "flex"; w.style.flexDirection = "column"; w.style.gap = "6px";
      w.appendChild(document.createTextNode(lbl)); w.appendChild(node); return w;
    }
    var ti = document.createElement("input"); ti.type = "text"; ti.value = m.titel;
    var ba = document.createElement("input"); ba.type = "text"; ba.value = m.bereich;
    var tx = document.createElement("textarea"); tx.value = m.text;
    ed.appendChild(field("Kurztitel", ti));
    ed.appendChild(field("Bereich", ba));
    ed.appendChild(field("Text", tx));
    var msg = document.createElement("span"); msg.className = "mono"; msg.setAttribute("role", "status");
    var acts = document.createElement("div"); acts.className = "acts";
    var save = btn("Speichern", "sig", async function () {
      var text = tx.value.trim();
      if (!text) { msg.textContent = "Der Text darf nicht leer sein."; return; }
      save.disabled = true; msg.textContent = "Wird gespeichert …";
      try {
        await colRef.doc(m.id).update({ titel: ti.value.trim(), bereich: ba.value.trim(), text: text });
        finishEdit();
      } catch (err) {
        save.disabled = false;
        msg.textContent = err && err.code === "invalid_argument" ? "Nur Lesezugriff auf diesem Logbuch." : "Speichern hat nicht geklappt. Bitte noch einmal tippen.";
      }
    });
    acts.appendChild(save);
    acts.appendChild(btn("Abbrechen", "", finishEdit));
    ed.appendChild(acts); ed.appendChild(msg);
    a.appendChild(ed);
    layout();
    tx.focus();
  }
  function askDelete(c, acts) {
    acts.textContent = "";
    var q = document.createElement("div"); q.className = "confirm";
    var l = document.createElement("span"); l.className = "mono"; l.textContent = "Moment löschen?";
    q.appendChild(l);
    q.appendChild(btn("Löschen", "sig", async function () {
      try { await colRef.doc(c.m.id).delete(); }
      catch (err) { l.textContent = "Löschen hat nicht geklappt."; }
    }));
    q.appendChild(btn("Behalten", "", function () { build(lastDocs); }));
    acts.appendChild(q);
    layout();
  }

  var lastDocs = [];
  function build(docs) {
    if (editing) { pendingDocs = docs; return; }
    lastDocs = docs;
    moments = docs.map(function (doc) {
      var m = doc.data() || {}; var d = new Date(m.datum);
      return { id: doc.id, d: isNaN(d) ? new Date() : d, titel: m.titel || "", bereich: m.bereich || "", text: m.text || "" };
    }).sort(function (a, b) { return b.d - a.d; });
    track.querySelectorAll(".moment, .empty").forEach(function (n) { n.remove(); });
    cards = moments.map(function (m) {
      var a = document.createElement("article"); a.className = "moment";
      var s = document.createElement("div"); s.className = "stamp";
      var t = document.createElement("time"); t.className = "mono"; t.dateTime = m.d.toISOString();
      t.textContent = stamp(m.d) + " · KW " + kw(m.d); s.appendChild(t);
      if (m.bereich) { var b = document.createElement("span"); b.className = "label area"; b.textContent = m.bereich; s.appendChild(b); }
      a.appendChild(s);
      if (m.titel) { var h = document.createElement("h2"); h.textContent = m.titel; a.appendChild(h); }
      var p = document.createElement("p"); p.textContent = m.text; a.appendChild(p);
      track.appendChild(a);
      var card = { m: m, el: a };
      if (writable) {
        var acts = document.createElement("div"); acts.className = "acts";
        acts.appendChild(btn("Bearbeiten", "", function () { openEditor(card); }));
        acts.appendChild(btn("Löschen", "warn", function () { askDelete(card, acts); }));
        a.appendChild(acts);
      }
      return card;
    });
    readouts();
    layout();
  }

  var ticking = false;
  window.addEventListener("scroll", function () {
    if (ticking) return; ticking = true;
    requestAnimationFrame(function () { ticking = false; scan(); });
  }, { passive: true });
  var rt; window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(layout, 120); });

  // Erste Darstellung ohne Daten: leere Skala
  layout();

  var KEY = "km-pass";
  var form = document.getElementById("unlock"), fs = document.getElementById("formstatus");
  function store(get, val) {
    try { if (get) return localStorage.getItem(KEY); if (val === null) localStorage.removeItem(KEY); else localStorage.setItem(KEY, val); } catch (e) { return null; }
  }
  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  async function decrypt(box, pass) {
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(box.salt), iterations: box.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(box.iv) }, key, b64(box.data));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  var box = null;
  async function open(pass, remember) {
    var list = await decrypt(box, pass);
    if (remember) store(false, pass);
    form.hidden = true;
    document.getElementById("lockcap").hidden = false;
    loaded = true;
    build(list.map(function (m) { return { id: m.id, data: function () { return m; } }; }));
  }
  function showLock(msg) {
    form.hidden = false; loaded = false;
    document.getElementById("statusword").textContent = "Gesperrt";
    if (msg) fs.textContent = msg;
    build([]);
  }
  document.getElementById("lockbtn").addEventListener("click", function () {
    store(false, null); document.getElementById("lockcap").hidden = true; showLock(); document.getElementById("pass").focus();
  });
  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    var b = document.getElementById("unlockbtn"); b.disabled = true; fs.textContent = "Wird entschlüsselt …";
    try { await open(document.getElementById("pass").value, document.getElementById("remember").checked); document.getElementById("pass").value = ""; }
    catch (err) { fs.textContent = "Passphrase passt nicht. Bitte noch einmal eingeben."; }
    finally { b.disabled = false; }
  });

  async function start() {
    try {
      var r = await fetch("momente.enc.json", { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      box = await r.json();
    } catch (e) {
      loaded = true; document.getElementById("statusword").textContent = "Keine Daten"; layout(); return;
    }
    var saved = store(true);
    if (saved) { try { await open(saved, false); return; } catch (e) { store(false, null); } }
    showLock();
  }
  start();
})();
</script>
</body>
</html>
